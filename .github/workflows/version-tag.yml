name: version tagged
# Version bumps used to land untagged and stay that way — and the first pass at
# fixing that (fail main pushes until someone tagged by hand) guaranteed a red
# run on every release. Now the bump itself is the release action: any push to
# main whose pyproject version has no tag gets tagged automatically. Fails only
# if tagging fails.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags
      - name: tag the pyproject version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already tagged."
          else
            git tag "v$version"
            git push origin "v$version"
            echo "tagged v$version at $(git rev-parse --short HEAD)"
          fi
